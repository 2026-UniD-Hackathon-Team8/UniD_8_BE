services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: damideo
      MYSQL_USER: damideo
      MYSQL_PASSWORD: damideo
      MYSQL_ROOT_PASSWORD: root
      TZ: UTC
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
